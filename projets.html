<script>
let currentSlide = 0;
const slides = document.querySelectorAll(".slide");

// INSTANT HASH CHECK: Runs immediately before the page paints to prevent flashing
const hash = window.location.hash; 
if (hash) {
    const targetSlide = document.querySelector(hash);
    if (targetSlide) {
        document.querySelector(".active-slide").classList.remove("active-slide");
        currentSlide = Array.from(slides).indexOf(targetSlide);
        slides[currentSlide].classList.add("active-slide");
    }
}

function fitActiveTitle() {
    const activeSlide = document.querySelector(".slide.active-slide");
    if (!activeSlide) return;
    const title = activeSlide.querySelector('h4');
    if (!title) return;

    // DYNAMIC TITLE COLORING
    let htmlContent = title.innerHTML;
    if (!htmlContent.includes('header-paren') && htmlContent.includes('(')) {
        title.innerHTML = htmlContent.replace(/(\(.*?\))/g, '<span class="header-paren">$1</span>');
    }

    title.style.fontSize = "2.2rem";
    title.style.opacity = "1";
    const container = activeSlide.querySelector('.slide-header');
    let size = 2.2;
    while (title.scrollWidth > (container.clientWidth - 120) && size > 1.0) {
        size -= 0.1;
        title.style.fontSize = size + "rem";
    }
}

function changeSlide(direction) {
    slides[currentSlide].classList.remove("active-slide");
    currentSlide = (currentSlide + direction + slides.length) % slides.length;
    slides[currentSlide].classList.add("active-slide");
    fitActiveTitle();
}

window.addEventListener('load', fitActiveTitle);
window.addEventListener('resize', fitActiveTitle);
window.addEventListener('languageChanged', fitActiveTitle);

// ORIGINAL ZOOM + NEW PANNING FUNCTION
document.querySelectorAll('.slide-image.zoom-on-hover, .slide-video').forEach(media => {
    
    // 1. Click to toggle zoom and set initial anchor point
    media.addEventListener('click', function(e) {
        this.classList.toggle('super-zoomed');
        if (!this.classList.contains('super-zoomed')) {
            // Reset to center when zooming out
            setTimeout(() => { this.style.transformOrigin = 'center center'; }, 400); 
        } else {
            // Zoom in on the exact click location
            const x = (e.offsetX / this.offsetWidth) * 100;
            const y = (e.offsetY / this.offsetHeight) * 100;
            this.style.transformOrigin = `${x}% ${y}%`;
        }
    });

    // 2. Mouse move to pan the image while it is zoomed in
    media.addEventListener('mousemove', function(e) {
        if (this.classList.contains('super-zoomed')) {
            const x = (e.offsetX / this.offsetWidth) * 100;
            const y = (e.offsetY / this.offsetHeight) * 100;
            this.style.transformOrigin = `${x}% ${y}%`;
        }
    });
});
</script>
