<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ren McKINNELL / Portfolio</title>
    <link rel="icon" type="image/x-icon" href="figma herobackground.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Oxanium:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    /* Manual override: keeps the middle 'room' but hides the buttons */
    .lang-switcher-container {
        visibility: hidden !important; 
        pointer-events: none !important;
    }
</style>
</head>
<body>

<header id="main-header">
    <a href="index.html" class="home-link">
        <h1><span class="name-highlight">Ren McKINNELL</span> <span class="page-slash" data-key="nav_page_title">/ Accueil</span></h1>
    </a>

    <div class="lang-switcher-container">
        <button class="lang-btn sub-btn left" style="--dir: -55px" onclick="switchLanguage('en')">EN</button>
        <button class="lang-btn main-btn">FR</button>
        <button class="lang-btn sub-btn right" style="--dir: 55px" onclick="switchLanguage('es')">ES</button>
    </div>

<nav id="main-nav">
    <ul>
        <li><a href="projets.html" data-key="nav_portfolio"></a></li>
        <li><a href="apropos.html" data-key="nav_about"></a></li>
        <li><a href="contact.html" data-key="nav_contact"></a></li>
    </ul>
</nav>

</header>

    <main>  

<section id="hero">
    <a href="apropos.html" class="profile-link">
        <div class="profile-card">
            
            <div class="image-wrapper">
                <div class="hero-circle-hub">
                    <div class="og-lang-hub">
                        <button class="og-lang-btn fr active-lang" onclick="event.preventDefault(); event.stopPropagation(); switchLanguage('fr')">FR</button>
                        <span class="hub-divider">|</span>
                        <button class="og-lang-btn en" onclick="event.preventDefault(); event.stopPropagation(); switchLanguage('en')">EN</button>
                        <span class="hub-divider">|</span>
                        <button class="og-lang-btn es" onclick="event.preventDefault(); event.stopPropagation(); switchLanguage('es')">ES</button>
</div>
                </div>
            </div>
            
            <div class="text-content fade-in-text">
                <p>
                    <span data-key="hero_tagline">Californienne trilingue<br>basée à Paris,</span><br>
                    <span class="highlight" data-key="hero_role">Je suis Developpeuse de <br>contenu numérique.</span>
                </p>
            </div>
            
        </div>
    </a>
</section>

<section id="portfolio-grid">
    <a href="projets.html#owl-animation-slide" class="card-link">
        <img src="UX FR.svg" alt="Design UI/UX & Art" class="lang-img" data-base-name="UX">
    </a>

    <a href="projets.html#i18n" class="card-link">
        <img src="Localization FR.svg" alt="Code & Localisation" class="lang-img" data-base-name="Localization">
    </a>

    <a href="projets.html#runaway-video-slide" class="card-link">
        <img src="Strategy FR.svg" alt="Stratégie & IA" class="lang-img" data-base-name="Strategy">
    </a>
</section>

    </main>
</body>
<script src="i18n.js"></script>
</body>

</html>
